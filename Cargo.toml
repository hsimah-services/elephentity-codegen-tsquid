[package]
name = "elephentity-codegen-tsquid"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Compile tsquid server manifests for Elephentity PHP applications"

[[bin]]
name = "eleph-gen-tsquid"
path = "rust/main.rs"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
