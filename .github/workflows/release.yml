name: Release

# On a v* tag: build eleph-gen-tsquid for linux-x64, linux-arm64, osx-arm64 and win-x64, check the
# archives, and publish them with SHA256SUMS to the tag's GitHub Release. The build, the checks and
# the archive names are elephentity-codegen's reusable workflow (its docs/RELEASING.md); the names are
# what `eleph install` looks for when eleph.json pins "eleph-gen-tsquid@<version>".
#
# Releasing is the owner's call: tag the commit (annotated) and push the tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binary:
    # Pin to a tag of elephentity-codegen once one exists (its docs/RELEASING.md says to).
    uses: hsimah-services/elephentity-codegen/.github/workflows/release-binary.yml@main
    with:
      binary: eleph-gen-tsquid
