name: Release check

# Proves the release path on a pull request without a tag: all four archives build, checksums verify
# and the linux-x64 binary starts in clean containers. Publishing happens only for a tag.

on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'

# GitHub checks the called workflow's permissions against this one even for a job that does not run,
# and its publish job asks for write. Nothing here publishes: that job only runs for a tag.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    uses: hsimah-services/elephentity-codegen/.github/workflows/release-binary.yml@main
    with:
      binary: eleph-gen-tsquid
